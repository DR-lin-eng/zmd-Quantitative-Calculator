<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue Test</title>
</head>
<body>
    <div id="app">
        <h1>{{ message }}</h1>
        <button @click="count++">Count: {{ count }}</button>
        <div @wheel="handleWheel" style="width: 200px; height: 200px; border: 1px solid black; margin: 20px;">
            Scroll here (wheel event test)
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;

        const app = createApp({
            data() {
                return {
                    message: 'Vue is working!',
                    count: 0
                }
            },
            methods: {
                handleWheel(event) {
                    event.preventDefault();
                    console.log('Wheel event triggered');
                }
            }
        });

        app.mount('#app');
    </script>
</body>
</html>
